<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pendolo Relativistico</title>
  <!-- Aggiunta di un font moderno di Google -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* Variabili CSS per gestire facilmente i colori */
    :root {
      --bg-dark: #0b0f19;
      --bg-canvas: #151b2b;
      --panel-bg: rgba(25, 33, 50, 0.6);
      --accent: #00d2ff;
      --text-main: #e2e8f0;
    }

    body {
      margin: 0;
      /* Sfondo con gradiente radiale per dare profondità */
      background: radial-gradient(circle at center, #1a2333 0%, var(--bg-dark) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      color: white;
      text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 100%;
      max-width: 650px;
    }

    canvas {
      background-color: var(--bg-canvas);
      /* Arrotondamento e ombreggiatura per far risaltare il canvas */
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255,255,255,0.05);
      max-width: 100%;
      height: auto; /* Rende il canvas responsive */
    }

    /* Pannello di controllo con effetto Glassmorphism */
    .controls {
      background-color: var(--panel-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 24px;
      border-radius: 12px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-sizing: border-box;
    }

    #timer {
      font-size: 1.3rem;
      font-weight: 600;
      text-align: center;
      color: var(--accent);
      background: rgba(0, 0, 0, 0.3);
      padding: 12px;
      border-radius: 8px;
      letter-spacing: 0.5px;
    }

    .slider-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .slider-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .slider-group span.value-display {
      font-weight: 600;
      color: white;
    }

    /* Stile personalizzato per lo slider (Chrome, Safari, Edge) */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #2a364f;
      border-radius: 3px;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 20px;
      width: 20px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      margin-top: -7px;
      box-shadow: 0 0 10px var(--accent);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type="range"]:focus {
      outline: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pendolo Relativistico</h1>
    
    <canvas id="pendulumCanvas" width="600" height="400"></canvas>
    
    <div class="controls">
      <div id="timer">Tempo passato: 0.0s</div>
      
      <div class="slider-group">
        <label for="speedSlider">
          Velocità del razzo: 
          <span class="value-display"><span id="speedValue">0.00</span> c</span>
        </label>
        <input type="range" id="speedSlider" min="0" max="0.99" step="0.001" value="0" />
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
